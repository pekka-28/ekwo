<!doctype html>
<html lang="en" data-native="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f5fe0"><title>{{TITLE}}</title><link rel="stylesheet" href="native.css">{{APP_STYLES}}<link rel="stylesheet" href="shell.css"><link rel="icon" href="{{MARK}}"><meta name="referrer" content="no-referrer">{{CSP}}</head>
