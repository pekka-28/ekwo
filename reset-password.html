<!doctype html>
<html lang="en" data-theme="day" data-palette="cobalt">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://adwpwvxulsksntngchxf.supabase.co; font-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Reset password — Lustre</title><link rel="icon" href="lustre-leaf.svg">
  <link rel="stylesheet" href="native.css"><link rel="stylesheet" href="lustre-brand.css">
</head>
<body><main class="mx-auto max-w-reading px-5 py-10">
  <a href="sign-in.html" class="brand lustre-logotype">Lustre</a>
  <h1 class="mt-2 text-3xl">Reset your password</h1>
  <p class="mt-4">Use the email address for your accounting account.</p>
  <p id="message" role="status" aria-live="polite" class="mt-4"></p>
  <form id="request-form" class="mt-8">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required class="block w-full rounded-sm border border-line px-3 py-2.5">
    <button type="submit" class="mt-4 rounded-pill px-5 py-2.5 bg-brand-solid text-brand-on">Send recovery email</button>
  </form>
  <form id="update-form" class="mt-8" hidden>
    <label for="new-password">New password</label>
    <input id="new-password" type="password" autocomplete="new-password" required class="block w-full rounded-sm border border-line px-3 py-2.5">
    <label for="confirm-password">Confirm new password</label>
    <input id="confirm-password" type="password" autocomplete="new-password" required class="block w-full rounded-sm border border-line px-3 py-2.5">
    <button type="submit" class="mt-4 rounded-pill px-5 py-2.5 bg-brand-solid text-brand-on">Save new password</button>
  </form>
  <p class="mt-8"><a href="sign-in.html">Back to sign in</a></p>
</main><script type="module" src="src/password-reset.js"></script></body></html>
