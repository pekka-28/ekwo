<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f5fe0"><title>Ekwo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="shell.css"><link rel="icon" href="mark.svg"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://adwpwvxulsksntngchxf.supabase.co; font-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'"></head>
<body>
<header><a class="brand" href="#"><img src="mark.svg" alt="">Ekwo</a><nav><a href="guide.html">User guide</a><button id="sign-out" class="quiet" hidden>Sign out</button><button class="icon-button" id="accent-toggle" aria-label="Change the accent" title="Change the accent"><span class="accent-dot"></span></button><button class="icon-button" id="theme-toggle" aria-label="Day or night" title="Day or night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg></button></nav></header>
<main id="login"><section class="welcome"><p class="eyebrow">YOUR PROJECT ACCOUNT</p><h1>Sign in to Ekwo</h1></section><form id="login-form" class="card"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">Sign in</button><p id="login-error" role="alert"></p><p class="account-help">Use the project account configured for your practice. This opens Lustre scenario planning; your Ekwo Cloud code is a separate sign-in.</p></form></main>
<main id="workspace" hidden>
<aside id="sidebar"><div class="company-switch"><button id="company-toggle" aria-expanded="false" aria-controls="company-menu"><span><small>COMPANY</small><span id="company-name">Choose a company</span></span><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="company-menu" hidden><div id="company-options"></div><a href="https://cloud.ekwo.ai/" target="_blank" rel="noopener">All companies</a></div></div><nav id="side-menu" aria-label="Main navigation"></nav></aside>
<section id="case-workspace"><p class="eyebrow" id="breadcrumb">CASES</p><div class="page-heading"><h1 id="page-title">Choose a company</h1><div id="page-actions"></div></div><p id="status" role="status" hidden></p><div id="content"></div></section>
</main>
<dialog id="editor"><form id="editor-form"><div class="page-heading"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="Close">&times;</button></div><div id="editor-fields"></div><p id="editor-error" role="alert"></p><div class="form-actions"><button type="button" id="cancel-editor">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog>
<script type="module" src="theme.js"></script><script type="module" src="app.js"></script></body></html>
